<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a120e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef4ef" media="(prefers-color-scheme: light)">
<title>Arbitragem — Ganhos &amp; Despesas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#0a120e; --bg-grad:radial-gradient(1100px 480px at 50% -8%, rgba(52,211,153,.16), transparent 62%);
  --card:#111c16; --card2:#182821; --line:#233b2e;
  --txt:#eef6f0; --mut:#8fa99a;
  --acc:#34d399; --acc2:#10b981;
  --grad:linear-gradient(135deg,#059669,#34d399);
  --warn:#fbbf24; --err:#f87171; --blue:#60a5fa; --gray:#94a3b8;
  --r:16px; --shadow:0 10px 26px rgba(0,0,0,.32);
  /* Fundo de botões e filtros com texto branco: o --grad claro dava 1,9:1 a 3,8:1
     de contraste. Este dá 5,5:1 a 7:1 (WCAG AA pede 4,5:1) em qualquer tema. */
  --grad-txt:linear-gradient(135deg,#065f46,#047857);
  --hdr-bg:rgba(10,18,14,.78); --tab-bg:rgba(17,28,22,.88);
  --card-img:linear-gradient(180deg,rgba(24,40,33,.55),rgba(17,28,22,1));
}
@media (prefers-color-scheme: light){
  :root{--bg:#eef4ef;--bg-grad:radial-gradient(1100px 480px at 50% -8%, rgba(16,185,129,.14), transparent 62%);
  --card:#ffffff;--card2:#e7f1ea;--line:#d3e3d8;--txt:#122019;--mut:#51685b;
  --acc:#059669;--acc2:#059669;--grad:linear-gradient(135deg,#047857,#10b981);
  --warn:#b45309;--err:#dc2626;--blue:#2563eb;--gray:#64748b;--shadow:0 8px 22px rgba(15,50,35,.10);
  --hdr-bg:rgba(238,244,239,.82);--tab-bg:rgba(255,255,255,.88);--card-img:none}
}
/* Tema escolhido à mão em Definições -> Aparência. O atributo data-tema no
   <html> ganha ao que o sistema diz; sem atributo, manda o sistema. */
html[data-tema="claro"]{
  --bg:#eef4ef;--bg-grad:radial-gradient(1100px 480px at 50% -8%, rgba(16,185,129,.14), transparent 62%);
  --card:#ffffff;--card2:#e7f1ea;--line:#d3e3d8;--txt:#122019;--mut:#51685b;
  --acc:#059669;--acc2:#059669;--grad:linear-gradient(135deg,#047857,#10b981);
  --warn:#b45309;--err:#dc2626;--blue:#2563eb;--gray:#64748b;--shadow:0 8px 22px rgba(15,50,35,.10);
  --hdr-bg:rgba(238,244,239,.82);--tab-bg:rgba(255,255,255,.88);--card-img:none}
html[data-tema="escuro"]{
  --bg:#0a1310;--bg-grad:radial-gradient(1100px 480px at 50% -8%, rgba(16,185,129,.16), transparent 62%);
  --card:#111c16;--card2:#182821;--line:#233b2e;--txt:#eef6f0;--mut:#8fa99a;
  --acc:#34d399;--acc2:#10b981;--grad:linear-gradient(135deg,#059669,#34d399);
  --warn:#fbbf24;--err:#f87171;--blue:#60a5fa;--gray:#94a3b8;--shadow:0 10px 26px rgba(0,0,0,.32);
  --hdr-bg:rgba(10,18,14,.78);--tab-bg:rgba(17,28,22,.88);
  --card-img:linear-gradient(180deg,rgba(24,40,33,.55),rgba(17,28,22,1))}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
html{font-size:16px}
body{background:var(--bg);background-image:var(--bg-grad);background-repeat:no-repeat;color:var(--txt);
 font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(78px + env(safe-area-inset-bottom));min-height:100vh}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;
 padding:calc(12px + env(safe-area-inset-top)) 16px 10px;
 background:var(--hdr-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 auto;overflow:hidden}
.brand>div{min-width:0}
.team,header h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emblem{width:42px;height:42px;border-radius:14px;background:var(--grad-txt);display:flex;align-items:center;justify-content:center;
 font-weight:900;color:#fff;font-size:.9rem;letter-spacing:.02em;box-shadow:0 4px 14px rgba(16,185,129,.38);flex:0 0 auto}
.team{font-size:.72rem;font-weight:800;letter-spacing:.16em;color:var(--acc);text-transform:uppercase}
header h1{font-size:1.28rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.epoca-pill{font-size:.7rem;font-weight:700;color:var(--acc);background:rgba(52,211,153,.12);
 border:1px solid rgba(52,211,153,.3);padding:5px 11px;border-radius:99px;white-space:nowrap}
.hright{display:flex;align-items:center;gap:8px;flex:0 0 auto;max-width:62%}
/* A 375 px o cabeçalho não tem espaço para tudo: a linha da equipa é
   identidade, não informação, e a palavra "Época" é redundante ao lado do ano. */
@media (max-width:430px){
  .team{display:none}
  .epoca-pill .rot-longo{display:none}
  header{padding-top:calc(10px + env(safe-area-inset-top));gap:8px}
  header h1{font-size:1.12rem}
  .brand{gap:9px}
  .emblem{width:34px;height:34px;border-radius:11px;font-size:.78rem}
  .epoca-pill,.syncdot{padding:5px 9px;font-size:.68rem}
}
.syncdot{border:1px solid var(--line);background:var(--card2);color:var(--mut);border-radius:99px;
 padding:5px 10px;font-size:.72rem;font-weight:700;line-height:1;white-space:nowrap;cursor:pointer;
 font-family:inherit;transition:color .2s,border-color .2s}
.syncdot.a{color:var(--blue);border-color:rgba(96,165,250,.45)}
.syncdot.ok{color:var(--acc);border-color:rgba(52,211,153,.4)}
.syncdot.e{color:var(--err);border-color:rgba(248,113,113,.45)}
main{padding:14px 14px 28px;max-width:640px;margin:0 auto}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;
 background:var(--tab-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;position:relative;background:none;border:none;color:var(--mut);font-size:.74rem;font-weight:600;
 padding:9px 0 11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:color .2s}
.tabbar button .ic{font-size:1.3rem;line-height:1.15;transition:transform .2s}
.tabbar button.on{color:var(--acc)}
.tabbar button.on .ic{transform:translateY(-1px) scale(1.08)}
.tabbar button.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:3px;
 border-radius:0 0 4px 4px;background:var(--grad)}
.fab{position:fixed;right:18px;bottom:calc(82px + env(safe-area-inset-bottom));z-index:29;width:58px;height:58px;border-radius:19px;
 border:none;background:var(--grad-txt);color:#fff;font-size:1.9rem;line-height:1;box-shadow:0 10px 24px rgba(16,185,129,.42);
 cursor:pointer;transition:transform .15s}
.fab:active{transform:scale(.9) rotate(90deg)}
.card{background:var(--card-img);background-color:var(--card);
 border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);
 animation:fadeUp .3s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:.8rem}
.big{font-size:1.4rem;font-weight:800;letter-spacing:-.02em}
.big,.val{font-variant-numeric:tabular-nums}
.val{font-weight:700;color:var(--acc)}
.neg{color:var(--err)}
.badge{font-size:.72rem;padding:3px 9px;border-radius:99px;font-weight:700;white-space:nowrap;letter-spacing:.02em}
.b-agendado{background:rgba(96,165,250,.16);color:var(--blue)}
.b-realizado{background:rgba(251,191,36,.14);color:var(--warn)}
.b-pago{background:rgba(52,211,153,.15);color:var(--acc)}
.b-cancelado{background:rgba(148,163,184,.16);color:var(--gray)}
.jhead{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.datebox{flex:0 0 auto;width:48px;height:54px;border-radius:13px;background:var(--card2);border:1px solid var(--line);
 display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;gap:1px}
.datebox .dd{font-size:1.2rem;font-weight:800}
.datebox .mm{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--acc)}
.jmain{flex:1;min-width:0}
.teams{font-weight:700;font-size:.98rem;line-height:1.25}
.teams .vs{color:var(--mut);font-weight:600;font-size:.72rem;padding:0 3px;text-transform:uppercase}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 12px;margin-top:-6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
/* Há mais filtros para a direita: a ponta desvanece, para se perceber que dá para deslizar. */
.chips.mais{-webkit-mask-image:linear-gradient(to right,#000 82%,transparent);mask-image:linear-gradient(to right,#000 82%,transparent)}
/* Com rato não há como deslizar uma linha sem barra de scroll: no computador
   os filtros passam para a linha de baixo e ficam todos à vista. */
@media (hover:hover) and (pointer:fine){.chips{flex-wrap:wrap;overflow:visible}.chips.mais{-webkit-mask-image:none;mask-image:none}}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:99px;
 padding:0 16px;min-height:44px;display:inline-flex;align-items:center;font-size:.85rem;font-weight:600;
 cursor:pointer;transition:all .18s}
.chip.on{background:var(--grad-txt);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(16,185,129,.35)}
select,input,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--txt);
 padding:12px 13px;min-height:46px;font-size:1rem;font-family:inherit;transition:border-color .15s,box-shadow .15s}
textarea{min-height:96px}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--acc2);box-shadow:0 0 0 3px rgba(16,185,129,.22)}
label{display:block;font-size:.74rem;color:var(--mut);margin:11px 0 5px;font-weight:700;letter-spacing:.02em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:none;border-radius:12px;padding:11px 16px;font-size:.92rem;font-weight:700;cursor:pointer;
 background:var(--card2);color:var(--txt);transition:transform .12s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--grad-txt);color:#fff;box-shadow:0 4px 14px rgba(16,185,129,.3)}
.btn.dngr{background:rgba(248,113,113,.13);color:var(--err)}
.btn.sm{padding:8px 13px;font-size:.8rem;border-radius:10px;min-height:44px}
.btnrow{display:flex;gap:8px;margin-top:14px}
/* As ações do cartão quebram para a linha seguinte em vez de empurrarem o
   total para fora — com alvos de 44 px já não cabem todas a 375 px. */
.acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.btnrow .btn{flex:1}
dialog{border:none;border-radius:22px 22px 0 0;background:var(--card);color:var(--txt);width:100%;max-width:640px;
 margin:auto auto 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;
 box-shadow:0 -14px 44px rgba(0,0,0,.5)}
dialog[open]{animation:sheetUp .26s ease}
@keyframes sheetUp{from{transform:translateY(26px);opacity:.5}to{transform:none;opacity:1}}
dialog::before{content:"";display:block;width:42px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
dialog::backdrop{background:rgba(3,9,6,.62);backdrop-filter:blur(3px)}
dialog h2{font-size:1.08rem;font-weight:800;margin-bottom:4px}
.atr{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px;margin-top:10px}
.atr .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.atr .calc{font-size:.83rem;margin-top:9px;display:flex;justify-content:space-between;align-items:center}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:4px}
details summary{cursor:pointer;list-style:none;padding:11px 0;font-size:.78rem;font-weight:700;color:var(--mut);
 letter-spacing:.02em;display:flex;align-items:center;gap:6px;min-height:44px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"›";display:inline-block;transition:transform .2s;font-size:1.1rem;line-height:1}
details[open] summary::before{transform:rotate(90deg)}
.atr details{margin-top:8px}
.warn{color:var(--warn);font-size:.77rem;margin-top:6px}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:8px}
.list-item:last-child{border-bottom:none}
.empty{text-align:center;color:var(--mut);padding:42px 20px;font-size:.9rem;line-height:1.6}
.empty .eico{display:block;font-size:2.6rem;margin-bottom:10px;filter:saturate(.85)}
.total-strip{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.total-strip .card{margin-bottom:0}
.stat{display:flex;gap:11px;align-items:center}
.stat .big{font-size:1.22rem}
.sico{font-size:1.25rem;width:40px;height:40px;border-radius:12px;background:var(--card2);border:1px solid var(--line);
 display:flex;align-items:center;justify-content:center;flex:0 0 auto}
canvas{width:100%;height:170px}
h3.sec{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin:20px 0 9px;font-weight:800;
 scroll-margin-top:76px}
.iconbtn{background:none;border:none;color:var(--mut);font-size:1.05rem;cursor:pointer;padding:6px;border-radius:8px;
 min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;transition:color .15s}
/* Apagar afastado de editar, e com a cor do perigo: estavam colados, do mesmo
   tamanho e da mesma cor, em membros, tarifas, almoços e distâncias. */
.iconbtn[data-delm],.iconbtn[data-delt],.iconbtn[data-dela],.iconbtn[data-deld],
.iconbtn[data-delk],.iconbtn[data-delf],.iconbtn[data-pgdel]{margin-left:10px;color:var(--err);opacity:.75}
.iconbtn[data-delm]:active,.iconbtn[data-delt]:active,.iconbtn[data-dela]:active,
.iconbtn[data-deld]:active,.iconbtn[data-delk]:active,.iconbtn[data-delf]:active{opacity:1}
.iconbtn:active{color:var(--txt)}
.sub{font-size:.85rem}
.tag{font-size:.72rem;background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:1px 7px;color:var(--mut);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(94px + env(safe-area-inset-bottom));
 background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--acc2);color:var(--txt);
 padding:11px 18px;border-radius:14px;font-size:.85rem;z-index:99;opacity:0;transition:opacity .25s,transform .25s;
 pointer-events:none;box-shadow:var(--shadow)}
.toast{display:flex;align-items:center;gap:12px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.toast.com-accao{pointer-events:auto}
.toast.erro{border-left-color:var(--err)}
.toast button{flex:0 0 auto}
#relatorio{display:none;position:fixed;inset:0;z-index:200;overflow-y:auto;background:#fff;color:#111827;
 padding:16px 16px 48px;font-size:.88rem;line-height:1.45;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.rel-on{overflow:hidden}
body.rel-on #relatorio{display:block}
#relatorio h1{font-size:1.15rem;margin-bottom:2px}
#relatorio h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:#6b7280;margin:18px 0 6px}
#relatorio .meta{color:#6b7280;font-size:.8rem;margin-bottom:6px}
#relatorio table{width:100%;border-collapse:collapse}
#relatorio th,#relatorio td{border-bottom:1px solid #e5e7eb;padding:5px 4px;text-align:left;vertical-align:top}
#relatorio th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:#6b7280;font-weight:700}
#relatorio td.n,#relatorio th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#relatorio tfoot td{font-weight:800;border-top:2px solid #111827;border-bottom:none}
.rel-bar{position:sticky;top:0;background:#fff;display:flex;gap:8px;justify-content:flex-end;padding-bottom:10px;margin-bottom:6px}
/* Quem pediu ao sistema menos movimento não leva com cartões a subir, folhas a
   deslizar nem o + a rodar. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
  .fab:active{transform:none}
}
@media print{
  body>*{display:none!important}
  body.rel-on #relatorio{display:block!important;position:static;padding:0;font-size:11pt}
  .no-print{display:none!important}
  #relatorio h2{page-break-after:avoid}
  #relatorio table{page-break-inside:auto}
  #relatorio tr{page-break-inside:avoid}
}
.upbar{position:fixed;left:12px;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:40;
 display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);
 border-left:3px solid var(--acc2);border-radius:14px;padding:11px 13px;box-shadow:var(--shadow);
 max-width:616px;margin:0 auto;animation:fadeUp .3s ease both}
.upbar .txt{flex:1;min-width:0;font-size:.84rem;font-weight:600}
/* A barra da nova versão fica exatamente onde está o botão +: num telemóvel o
   toque no + caía no "Atualizar" (que recarregava a app) e nunca abria o
   formulário. Com a barra visível, o + e os avisos sobem para cima dela. */
body.com-upbar .fab{bottom:calc(166px + env(safe-area-inset-bottom))}
body.com-upbar .toast{bottom:calc(172px + env(safe-area-inset-bottom))}
#loginScr{position:fixed;inset:0;z-index:100;background:var(--bg);background-image:var(--bg-grad);display:flex;align-items:center;justify-content:center;padding:24px}
.lbox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 22px;box-shadow:var(--shadow);animation:fadeUp .3s ease both;max-height:92vh;overflow-y:auto}
.bv-linha{margin-top:8px}
body.login-on header,body.login-on main,body.login-on .tabbar,body.login-on .fab,body.login-on .toast{display:none}
/* As despesas são de cada um: aí o assistente também lança, edita e apaga
   as SUAS. Mais específico do que a regra de baixo, por isso ganha. */
body.ro.tab-despesas .fab{display:block!important}
body.ro .fab,body.ro [data-act],body.ro [data-pgadd],body.ro [data-pgdel],body.ro [data-rm],body.ro #addAtr,
body.ro [data-editm],body.ro [data-delm],body.ro #addM,body.ro [data-editt],body.ro [data-delt],body.ro #addT,
body.ro [data-edita],body.ro [data-dela],body.ro #addA,body.ro [data-editd],body.ro [data-deld],body.ro #addD,
body.ro [data-editk],body.ro [data-delk],body.ro #addK,body.ro [data-tick],
body.ro [data-editf],body.ro [data-delf],body.ro #addF,
body.ro #cSave,body.ro #cNova,body.ro #reset,body.ro #mrgJson,body.ro #impJson,body.ro #btnConv{display:none!important}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="emblem" id="hEmblema">AR</div>
    <div><div class="team" id="hEquipa"></div><h1 id="hTitle">Jogos</h1></div>
  </div>
  <div class="hright">
    <button class="syncdot" id="hSync" hidden aria-live="polite" title="Estado da sincronização" aria-label="Estado da sincronização"></button>
    <div class="epoca-pill" id="hEpoca"></div>
  </div>
</header>
<main id="main"></main>
<button class="fab" id="fab" aria-label="Adicionar jogo">+</button>
<nav class="tabbar" aria-label="Secções da aplicação">
  <button data-tab="jogos" class="on" aria-current="page"><span class="ic" aria-hidden="true">⚽</span>Jogos</button>
  <button data-tab="despesas"><span class="ic" aria-hidden="true">🧾</span>Despesas</button>
  <button data-tab="multas"><span class="ic" aria-hidden="true">⚖️</span>Multas</button>
  <button data-tab="resumo"><span class="ic" aria-hidden="true">📊</span>Resumo</button>
  <button data-tab="config"><span class="ic" aria-hidden="true">⚙️</span>Definições</button>
</nav>
<dialog id="dlg"></dialog>
<dialog id="dlg2"></dialog>
